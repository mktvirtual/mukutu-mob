# WordPress + ACF free, as deployed on Coolify at https://wp.mukutu.cloud.
# Local development uses src/docker.yaml instead: this file maps no host port
# (Traefik reaches the container over the `coolify` network) and takes every
# credential from the environment, so no secret lands in the repository.
name: fia-wordpress-cloud

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.gzip-fia-wp.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.fia-wp-http.entryPoints=web
      - traefik.http.routers.fia-wp-http.rule=Host(`wp.mukutu.cloud`)
      - traefik.http.routers.fia-wp-http.middlewares=redirect-to-https@docker
      - traefik.http.routers.fia-wp.entryPoints=websecure
      - traefik.http.routers.fia-wp.rule=Host(`wp.mukutu.cloud`)
      - traefik.http.routers.fia-wp.tls=true
      - traefik.http.routers.fia-wp.tls.certresolver=le
      - traefik.http.routers.fia-wp.middlewares=gzip-fia-wp
      - traefik.http.routers.fia-wp.service=fia-wp
      - traefik.http.services.fia-wp.loadbalancer.server.port=80
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      # Traefik terminates TLS, so WordPress only learns the scheme from the
      # forwarded header. Without this every generated URL comes out as http.
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('WP_HOME', 'https://wp.mukutu.cloud');
        define('WP_SITEURL', 'https://wp.mukutu.cloud');
    volumes:
      - wp:/var/www/html
      # The theme comes from the repository clone Coolify made on the server.
      - ./theme/mukutu-base:/var/www/html/wp-content/themes/mukutu-base

  # Runs once, then exits: installs core and the free ACF from wordpress.org.
  provision:
    image: wordpress:cli
    restart: "no"
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes:
      - wp:/var/www/html
      - ./theme/mukutu-base:/var/www/html/wp-content/themes/mukutu-base
    user: "33:33"
    entrypoint: ["/bin/sh", "-c"]
    # One list item, so the whole script reaches `sh -c` as a single argument:
    # Coolify splits a plain string on whitespace and shreds the shell syntax.
    command:
      - |
        set -e
        # Do NOT probe with `wp db check` or `wp db query`: both shell out to
        # the mariadb client, which fails with "TLS/SSL error: self-signed
        # certificate" against this MySQL and loops forever even when the
        # database is up. Retrying the install itself is the honest probe --
        # it only succeeds once PHP can reach the database.
        for i in $$(seq 1 60); do
          if wp core is-installed --allow-root >/dev/null 2>&1; then break; fi
          wp core install \
            --url=https://wp.mukutu.cloud \
            --title="FIA Digital" \
            --admin_user="$${WP_ADMIN_USER}" \
            --admin_password="$${WP_ADMIN_PASSWORD}" \
            --admin_email="$${WP_ADMIN_EMAIL}" \
            --skip-email --allow-root && break
          echo "waiting for database... ($$i)"
          sleep 3
        done
        wp core is-installed --allow-root
        # The class logs into this install during the lesson, so the credentials
        # are deliberately the same as the local compose: admin / admin.
        if wp user get "$${WP_ADMIN_USER}" --allow-root >/dev/null 2>&1; then
          wp user update "$${WP_ADMIN_USER}" --user_pass="$${WP_ADMIN_PASSWORD}" --allow-root
        else
          wp user create "$${WP_ADMIN_USER}" "$${WP_ADMIN_EMAIL}" \
            --role=administrator --user_pass="$${WP_ADMIN_PASSWORD}" --allow-root
        fi
        wp plugin install advanced-custom-fields --activate --allow-root
        wp theme activate mukutu-base --allow-root
        # front-page.php renders the home, and functions.php attaches the ACF
        # group to whatever page is page_on_front -- so one has to exist.
        if ! wp post list --post_type=page --name=home --field=ID --allow-root | grep -q .; then
          wp post create --post_type=page --post_title="Home" --post_name=home --post_status=publish --allow-root
        fi
        HOME_ID=$$(wp post list --post_type=page --name=home --field=ID --allow-root | head -1)
        wp option update show_on_front page --allow-root
        wp option update page_on_front "$$HOME_ID" --allow-root
        wp core version --allow-root
        wp theme list --allow-root
        wp plugin list --allow-root

networks:
  coolify:
    external: true

volumes:
  db:
  wp:
