name: fia-wordpress

services:
  # MariaDB, not MySQL 8.4: the latter forces TLS and wp-cli then fails the
  # connection with "self-signed certificate in certificate chain".
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp:/var/www/html
      # O tema é editado no host e lido direto pelo container.
      - ./theme/mukutu-base:/var/www/html/wp-content/themes/mukutu-base

  # Runs once, then exits: installs core and the free ACF from wordpress.org.
  provision:
    image: wordpress:cli
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp:/var/www/html
      - ./theme/mukutu-base:/var/www/html/wp-content/themes/mukutu-base
    user: "33:33"
    entrypoint: ["/bin/sh", "-c"]
    # One list item, so the whole script reaches `sh -c` as a single argument.
    command:
      - |
        set -e
        until wp db check --allow-root >/dev/null 2>&1; do
          echo "waiting for database..."
          sleep 3
        done
        if ! wp core is-installed --allow-root; then
          wp core install \
            --url=http://localhost:8081 \
            --title="FIA Digital" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=dev@example.com \
            --skip-email --allow-root
        fi
        wp plugin install advanced-custom-fields --activate --allow-root
        wp core version --allow-root
        wp plugin list --allow-root

volumes:
  db:
  wp:
